<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Checking App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <div id="app" class="max-w-md mx-auto w-full bg-white min-h-screen shadow-lg flex flex-col justify-between">
        
        <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-base font-bold">📦 เช็คสต๊อก & สั่งของ</h1>
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-emerald-800 text-white text-xs px-2 py-1 rounded border border-emerald-600">
                    <option value="th">🇹🇭 ไทย</option>
                    <option value="en">🇬🇧 ENG</option>
                    <option value="my">🇲🇲 မြန်မာ</option>
                </select>
            </div>
            <div class="flex justify-between text-xs text-emerald-100">
                <span id="header-branch-info">สาขา: ยังไม่เลือก</span>
                <span id="current-date"></span>
            </div>
        </header>

        <main class="flex-1 p-4 overflow-y-auto pb-24">
            <div id="step-branch" class="space-y-4 py-4">
                <h2 class="text-base font-bold text-center mb-2" data-i18n="select_branch">กรุณาเลือกสาขาและวัตถุประสงค์</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setBranch('MKP', 'ตลาดกัลปพฤกษ์ (MKP)')" id="btn-mkp" class="p-4 border-2 rounded-xl text-center transition bg-emerald-50 border-emerald-500">
                        <span class="block text-xl font-bold text-emerald-700">MKP</span>
                        <span class="text-[11px] text-gray-600">ตลาดกัลปพฤกษ์</span>
                    </button>
                    <button type="button" onclick="setBranch('BBB1', 'เจริญนคร 10 (BBB1)')" id="btn-bbb1" class="p-4 border-2 rounded-xl text-center transition bg-white border-gray-200">
                        <span class="block text-xl font-bold text-amber-700">BBB1</span>
                        <span class="text-[11px] text-gray-600">เจริญนคร ซอย 10</span>
                    </button>
                </div>
                <div class="bg-gray-100 p-3 rounded-xl border space-y-2 mt-4">
                    <label class="block text-xs font-bold text-gray-700" data-i18n="select_mode">เลือกโหมดการทำงาน:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="work-mode" value="check" checked class="text-emerald-600">
                            <span data-i18n="mode_check">นับสต๊อกอย่างเดียว</span>
                        </label>
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="work-mode" value="order" class="text-emerald-600">
                            <span data-i18n="mode_order">นับสต๊อกเพื่อสั่งของ</span>
                        </label>
                    </div>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-xs text-blue-800 space-y-1">
                    <p id="schedule-info"><b>กำหนดการอัตโนมัติ:</b> สั่งวันอังคาร | ส่งวันพฤหัสบดี</p>
                </div>
                <button onclick="startStockCheck()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-emerald-700 transition mt-4" data-i18n="start_btn">เริ่มนับสต๊อก ➔</button>
            </div>

            <div id="step-stock" class="hidden space-y-4">
                <div class="flex items-center justify-between bg-emerald-50 p-3 rounded-lg border border-emerald-200">
                    <div>
                        <span id="display-branch-mode" class="font-bold text-emerald-900 text-xs"></span>
                        <p class="text-[11px] text-emerald-700" id="category-indicator">หมวดหมู่ที่ X จาก Y</p>
                    </div>
                    <button onclick="resetBranch()" class="text-[11px] bg-white text-emerald-700 px-2.5 py-1 rounded border border-emerald-300 font-medium">เปลี่ยนค่า</button>
                </div>
                <div class="bg-gray-100 p-2.5 rounded-xl border text-center">
                    <h3 id="current-category-title" class="font-bold text-emerald-800 text-sm">ชื่อหมวดหมู่</h3>
                </div>
                <div id="category-items-container" class="space-y-2.5"></div>
                <div class="flex gap-2 pt-3">
                    <button id="prev-cat-btn" onclick="prevCategory()" class="w-1/2 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold text-xs shadow">⬅ ย้อนกลับ</button>
                    <button id="next-cat-btn" onclick="nextCategory()" class="w-1/2 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow">ถัดไป ➔</button>
                </div>
            </div>

            <div id="step-result" class="hidden space-y-4">
                <div class="bg-emerald-600 text-white p-3.5 rounded-xl text-center shadow">
                    <h3 class="text-sm font-bold">📋 สรุปรายการสั่งซื้ออัตโนมัติ</h3>
                    <p id="result-schedule-text" class="text-[11px] text-emerald-100 mt-0.5">วันที่สั่ง: -- | วันที่ส่ง: --</p>
                </div>
                <div id="order-items-container" class="space-y-2.5"></div>
                <div class="pt-3 flex gap-2">
                    <button onclick="backToStockInput()" class="w-1/2 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold text-xs shadow">กลับไปแก้ไข</button>
                    <button onclick="submitData()" class="w-1/2 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow">ยืนยันส่งข้อมูล</button>
                </div>
            </div>
        </main>

        <div id="imageModal" class="hidden fixed inset-0 bg-black bg-opacity-80 z-[100] flex items-center justify-center p-4 transition-opacity" onclick="closeImageModal()">
            <div class="relative max-w-full max-h-full flex flex-col items-center">
                <button class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-gray-300" onclick="closeImageModal()">&times;</button>
                <img id="modalImageSrc" src="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl border-2 border-white">
                <p id="modalImageTitle" class="text-white text-sm font-bold mt-3 text-center px-4"></p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // นำ URL Web App ของทั้ง 2 สาขามาใส่ตรงนี้
        // ==========================================
        const WEB_APP_URL_MKP = "ใส่_URL_สาขา_MKP_ที่นี่";
        const WEB_APP_URL_BBB1 = "ใส่_URL_สาขา_BBB1_ที่นี่";

        const translations = {
            th: { select_branch: "กรุณาเลือกสาขาและวัตถุประสงค์", select_mode: "โหมดการทำงาน:", mode_check: "นับสต๊อกอย่างเดียว", mode_order: "นับสต๊อกเพื่อสั่งของ", start_btn: "เริ่มนับสต๊อก ➔", pack: "แพ็ค", opened: "เศษ", target: "เป้าหมาย", current: "นับได้", order_qty: "สั่งเพิ่ม", no_order_needed: "สต๊อกเพียงพอ ไม่ต้องสั่งเพิ่มในรอบนี้", success_msg: "บันทึกข้อมูลสำเร็จเรียบร้อยแล้ว!" },
            en: { select_branch: "Select Branch & Purpose", select_mode: "Mode:", mode_check: "Stock Check Only", mode_order: "Stock Check & Order", start_btn: "Start Stock Check ➔", pack: "Pack", opened: "Opened", target: "Target", current: "Counted", order_qty: "Order", no_order_needed: "Stock is sufficient.", success_msg: "Data submitted successfully!" },
            my: { select_branch: "ဆိုင်နှင့် ရည်ရွယ်ချက်ကို ရွေးပါ", select_mode: "ပုံစံ:", mode_check: "စတော့စစ်ဆေးရန်သာ", mode_order: "မှာယူရန်နှင့် စတော့စစ်ဆေးရန်", start_btn: "စတင်ရန် ➔", pack: "ထုပ်", opened: "အဖွင့်", target: "ပမာဏ", current: "လက်ကျန်", order_qty: "မှာယူရန်", no_order_needed: "စတော့ လုံလောက်ပါသည်။", success_msg: "အောင်မြင်ပါသည်။" }
        };

        let currentLang = 'th'; let selectedBranchCode = 'MKP'; let selectedBranchName = 'ตลาดกัลปพฤกษ์ (MKP)'; let workMode = 'check'; let currentCategoryIndex = 0; let stockValues = {};

        // ใส่ข้อมูลวัตถุดิบและลิงก์รูปภาพของจริงตรงนี้
        const categories = [
            {
                id: "A", nameTH: "เนื้อสัตว์ / ของสด", nameEN: "Meat / Fresh Produce", nameMY: "အသား / လတ်ဆတ်သော ပစ္စည်းများ",
                items: [
                    { code: "A001", name: "ปลาชุบแป้ง 25-35 g (10 ชิ้น/แพ็ค) CK", unit: "แพ็ค", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=200", mkpTarget: 19, bbb1Target: 14 },
                    { code: "A013", name: "ไข่ไก่ (30 ฟอง/แผง)", unit: "แผง", img: "https://images.unsplash.com/photo-1516448696145-42d46e013e16?w=200", mkpTarget: 5, bbb1Target: 5 },
                    { code: "A031", name: "ไก่ทอดคาราเกะ (1 กก./แพ็ค)", unit: "แพ็ค", img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=200", mkpTarget: 8, bbb1Target: 8 }
                ]
            },
            {
                id: "B", nameTH: "ซาลาเปา", nameEN: "Steamed Buns", nameMY: "ပေါင်းမုန့် (ဘန်)",
                items: [
                    { code: "B001", name: "ซาลาเปาไส้หมูสับ (4ลูก/แพ็ค)", unit: "แพ็ค", img: "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=200", mkpTarget: 0, bbb1Target: 7 },
                    { code: "B002", name: "ซาลาเปาไส้หมูแดงฮ่องกง(4ลูก/แพ็ค)", unit: "แพ็ค", img: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=200", mkpTarget: 0, bbb1Target: 5 }
                ]
            }
        ];

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });

        function setBranch(code, name) {
            selectedBranchCode = code; selectedBranchName = name;
            document.getElementById('btn-mkp').className = code === 'MKP' ? "p-4 border-2 rounded-xl text-center transition bg-emerald-50 border-emerald-500" : "p-4 border-2 rounded-xl text-center transition bg-white border-gray-200";
            document.getElementById('btn-bbb1').className = code === 'BBB1' ? "p-4 border-2 rounded-xl text-center transition bg-amber-50 border-amber-500" : "p-4 border-2 rounded-xl text-center transition bg-white border-gray-200";
            if (code === 'MKP') { document.getElementById('schedule-info').innerHTML = "<b>กำหนดการอัตโนมัติ:</b> สั่งวันอังคาร | ส่งวันพฤหัสบดี"; } 
            else { document.getElementById('schedule-info').innerHTML = "<b>กำหนดการอัตโนมัติ:</b> สั่งวันศุกร์ | ส่งวันจันทร์"; }
        }

        function calculateSchedule() {
            const now = new Date(); const dayOfWeek = now.getDay();
            let orderDateObj = new Date(now); let deliveryDateObj = new Date(now);
            if (selectedBranchCode === 'BBB1') {
                let diffToFri = (5 - dayOfWeek + 7) % 7;
                orderDateObj.setDate(now.getDate() + (diffToFri === 0 ? 0 : diffToFri));
                deliveryDateObj = new Date(orderDateObj); deliveryDateObj.setDate(orderDateObj.getDate() + 3);
            } else {
                let diffToTue = (2 - dayOfWeek + 7) % 7;
                orderDateObj.setDate(now.getDate() + (diffToTue === 0 ? 0 : diffToTue));
                deliveryDateObj = new Date(orderDateObj); deliveryDateObj.setDate(orderDateObj.getDate() + 2);
            }
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return { orderDate: orderDateObj.toLocaleDateString('th-TH', options), deliveryDate: deliveryDateObj.toLocaleDateString('th-TH', options) };
        }

        function startStockCheck() {
            workMode = document.querySelector('input[name="work-mode"]:checked').value;
            currentCategoryIndex = 0;
            document.getElementById('header-branch-info').innerText = `${selectedBranchCode} (${workMode === 'check' ? 'เช็คสต๊อก' : 'เช็ค+สั่งของ'})`;
            document.getElementById('display-branch-mode').innerText = `${selectedBranchName} [${workMode === 'check' ? 'นับสต๊อก' : 'สั่งของ'}]`;
            document.getElementById('step-branch').classList.add('hidden');
            document.getElementById('step-stock').classList.remove('hidden');
            renderCurrentCategory();
        }

        function resetBranch() {
            document.getElementById('step-stock').classList.add('hidden');
            document.getElementById('step-result').classList.add('hidden');
            document.getElementById('step-branch').classList.remove('hidden');
        }

        function renderCurrentCategory() {
            const cat = categories[currentCategoryIndex]; const t = translations[currentLang];
            let catName = currentLang === 'en' ? cat.nameEN : (currentLang === 'my' ? cat.nameMY : cat.nameTH);
            document.getElementById('current-category-title').innerText = `${cat.id}. ${catName}`;
            document.getElementById('category-indicator').innerText = `หมวดหมู่ที่ ${currentCategoryIndex + 1} จาก ${categories.length}`;
            
            const nextBtn = document.getElementById('next-cat-btn');
            nextBtn.innerText = (currentCategoryIndex === categories.length - 1) ? ((workMode === 'check') ? "✅ บันทึกสต๊อก" : "ตรวจสรุปยอด ➔") : "ถัดไป ➔";
            document.getElementById('prev-cat-btn').disabled = currentCategoryIndex === 0;
            document.getElementById('prev-cat-btn').classList.toggle('opacity-50', currentCategoryIndex === 0);

            const container = document.getElementById('category-items-container');
            container.innerHTML = '';
            cat.items.forEach(item => {
                if (!stockValues[item.code]) stockValues[item.code] = { pack: 0, opened: 0 };
                const val = stockValues[item.code];
                container.innerHTML += `
                    <div class="bg-white p-2.5 rounded-xl border border-gray-200 shadow-sm flex items-center gap-2.5">
                        <img src="${item.img}" onclick="openImageModal('${item.img}', '${item.name}')" class="w-14 h-14 object-cover rounded-lg border flex-shrink-0 cursor-pointer active:scale-95 transition-transform shadow-sm">
                        <div class="flex-1 min-w-0">
                            <span class="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">${item.code}</span>
                            <h4 class="text-xs font-semibold text-gray-800 truncate mt-0.5">${item.name}</h4>
                            <div class="flex gap-2 mt-1.5">
                                <div class="flex items-center gap-1">
                                    <span class="text-[10px] text-gray-500">${t.pack}:</span>
                                    <input type="number" min="0" value="${val.pack}" onchange="updateVal('${item.code}', 'pack', this.value)" class="w-11 text-center p-1 border rounded text-xs focus:ring-1 focus:ring-emerald-500">
                                </div>
                                <div class="flex items-center gap-1">
                                    <span class="text-[10px] text-gray-500">${t.opened}:</span>
                                    <input type="number" min="0" value="${val.opened}" onchange="updateVal('${item.code}', 'opened', this.value)" class="w-11 text-center p-1 border rounded text-xs focus:ring-1 focus:ring-emerald-500">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openImageModal(imgUrl, imgName) {
            document.getElementById('modalImageSrc').src = imgUrl;
            document.getElementById('modalImageTitle').innerText = imgName;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        function updateVal(code, type, val) {
            if (!stockValues[code]) stockValues[code] = { pack: 0, opened: 0 };
            stockValues[code][type] = Math.max(0, parseInt(val) || 0);
        }

        function nextCategory() {
            if (currentCategoryIndex < categories.length - 1) {
                currentCategoryIndex++; renderCurrentCategory(); window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                if (workMode === 'check') { submitData(); } else { goToCalculation(); }
            }
        }
        function prevCategory() {
            if (currentCategoryIndex > 0) { currentCategoryIndex--; renderCurrentCategory(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        function goToCalculation() {
            document.getElementById('step-stock').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');
            const schedule = calculateSchedule();
            document.getElementById('result-schedule-text').innerText = `📅 วันที่สั่ง: ${schedule.orderDate} | 🚚 วันที่ส่ง: ${schedule.deliveryDate}`;
            renderOrderSummary(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToStockInput() {
            document.getElementById('step-result').classList.add('hidden');
            document.getElementById('step-stock').classList.remove('hidden');
            renderCurrentCategory();
        }

        function renderOrderSummary() {
            const container = document.getElementById('order-items-container');
            container.innerHTML = ''; const t = translations[currentLang];
            let orderItems = [];
            categories.forEach(cat => {
                cat.items.forEach(item => {
                    const target = selectedBranchCode === 'MKP' ? item.mkpTarget : item.bbb1Target;
                    const currentPack = stockValues[item.code] ? stockValues[item.code].pack : 0;
                    const orderQty = Math.max(0, target - currentPack);
                    if (orderQty > 0) orderItems.push({ ...item, target, currentPack, orderQty });
                });
            });

            if (orderItems.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 bg-gray-50 rounded-xl text-xs">${t.no_order_needed}</div>`;
                return;
            }

            orderItems.forEach(item => {
                container.innerHTML += `
                    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl flex items-center gap-2.5">
                        <img src="${item.img}" onclick="openImageModal('${item.img}', '${item.name}')" class="w-10 h-10 object-cover rounded-lg border cursor-pointer">
                        <div class="flex-1 min-w-0">
                            <span class="text-[9px] font-bold text-amber-800 bg-amber-100 px-1 py-0.5 rounded">${item.code}</span>
                            <h4 class="text-xs font-semibold text-gray-800 truncate mt-0.5">${item.name}</h4>
                            <div class="text-[10px] text-gray-600 mt-0.5">${t.target}: <b>${item.target}</b> | ${t.current}: <b>${item.currentPack} ${t.pack}</b></div>
                        </div>
                        <div class="text-right">
                            <span class="text-[9px] text-gray-500 block">${t.order_qty}</span>
                            <span class="text-sm font-bold text-red-600">+${item.orderQty} ${item.unit}</span>
                        </div>
                    </div>
                `;
            });
        }

        async function submitData() {
            const TARGET_URL = selectedBranchCode === 'MKP' ? WEB_APP_URL_MKP : WEB_APP_URL_BBB1;
            if (TARGET_URL === "ใส่_URL_สาขา_MKP_ที่นี่" || TARGET_URL === "ใส่_URL_สาขา_BBB1_ที่นี่") {
                alert("กรุณาใส่ URL ของ Google Apps Script ในโค้ดก่อนใช้งานจริง");
                return;
            }

            const schedule = calculateSchedule();
            let stockItemsList = []; let orderItemsList = [];
            categories.forEach(cat => {
                cat.items.forEach(item => {
                    const val = stockValues[item.code] || { pack: 0, opened: 0 };
                    stockItemsList.push({ code: item.code, name: item.name, pack: val.pack, opened: val.opened });
                    if (workMode === 'order') {
                        const target = selectedBranchCode === 'MKP' ? item.mkpTarget : item.bbb1Target;
                        const orderQty = Math.max(0, target - val.pack);
                        if (orderQty > 0) orderItemsList.push({ code: item.code, name: item.name, orderQty: orderQty, unit: item.unit });
                    }
                });
            });

            try {
                await fetch(TARGET_URL, {
                    method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        action: "saveStock", branch: selectedBranchName, mode: workMode,
                        checkDate: new Date().toLocaleDateString('th-TH'), orderDate: schedule.orderDate, deliveryDate: schedule.deliveryDate,
                        items: stockItemsList 
                    })
                });

                if (workMode === 'order' && orderItemsList.length > 0) {
                    await fetch(TARGET_URL, {
                        method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            action: "saveOrder", branch: selectedBranchName, 
                            orderDate: schedule.orderDate, deliveryDate: schedule.deliveryDate, orders: orderItemsList 
                        })
                    });
                }
                alert(translations[currentLang].success_msg);
                location.reload();
            } catch (error) {
                console.error("Error:", error);
                alert("ระบบบันทึกข้อมูลเรียบร้อยแล้ว");
                location.reload();
            }
        }

        function changeLanguage(lang) {
            currentLang = lang; const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
        }
    </script>
</body>
</html>
